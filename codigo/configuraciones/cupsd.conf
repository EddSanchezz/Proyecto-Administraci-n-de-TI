# ============================================================================
# cupsd.conf - Servidor de impresion del Instituto ITEC (CUPS 2.4)
# ----------------------------------------------------------------------------
# Proyecto Final - Administracion de Infraestructura de TI (Uniquindio 2026-1)
# Instituto Tecnico de Educacion Comfenalco Quindio
#
# Se despliega con: codigo/instalacion/06_instalar_cups.sh
# destino en la VM : /etc/cups/cupsd.conf
#
# Escucha en todas las interfaces (0.0.0.0:631) pero solo la LAN
# 192.168.80.0/24 puede alcanzar el puerto gracias a las reglas UFW
# (codigo/seguridad/ufw_reglas.sh). Las directivas Allow restringen ademas
# el acceso a nivel de aplicacion (@LOCAL = subredes locales del servidor).
#
# Nota: la sintaxis Order/Allow esta marcada como heredada (deprecated) desde
# CUPS 2.4 y se mantiene por compatibilidad en la version 2.4.7 de
# Ubuntu 24.04; funciona correctamente y se reemplazara solo en CUPS 3.x.
# ============================================================================

# Escucha en todas las interfaces por IPv4 (filtrada por UFW a la LAN)
# y en el socket local para las herramientas del propio servidor.
Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# Mostrar impresoras compartidas de la red local (dnssd).
Browsing On
BrowseLocalProtocols dnssd

# Interfaz web de administracion habilitada (necesaria para gestionar colas).
WebInterface Yes

# Cifrado: solo se exige en zonas administrativas (el cliente decide en el
# resto, igual que hace la configuracion por defecto de CUPS).
DefaultEncryption IfRequested

# Registro de eventos del servidor.
LogLevel warn
PageLogFormat
MaxLogSize 1m

# ----------------------------------------------------------------------------
# Politicas de acceso (heredadas de la plantilla de CUPS, ajustadas al
# proyecto: solo la red local).
# ----------------------------------------------------------------------------
<Location />
    Order allow,deny
    Allow @LOCAL
</Location>

# Administracion de impresoras y colas: solo red local.
<Location /admin>
    Order allow,deny
    Allow @LOCAL
</Location>

# Archivos de configuracion via web: exige autenticacion (grupo @SYSTEM,
# que en Ubuntu corresponde a lpadmin) y solo desde la red local.
<Location /admin/conf>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow @LOCAL
</Location>

# Estado de los trabajos: lectura para la red local.
<Location /jobs>
    Order allow,deny
    Allow @LOCAL
</Location>

<Policy default>
    # Trabajos propios: un usuario administra sus trabajos.
    <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Cancel-Subscription Cancel-My-Jobs Close-Job Cancel-Job CUPS-Get-Document>
        Require user @OWNER @SYSTEM
        Order deny,allow
    </Limit>
    # Todas las impresoras: lectura y busqueda para la red local.
    <Limit CUPS-Get-Printers CUPS-Get-Classes CUPS-Get-Default CUPS-Get-Devices CUPS-Get-PPDs CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Set-Default>
        Order deny,allow
        Allow @LOCAL
    </Limit>
    # Apagar/reiniciar el servidor: solo administradores autenticados.
    <Limit Pause-Printer Resume-Printer Pause-Printer-After-Current-Job Enable-Printer Disable-Printer Cancel-Jobs>
        AuthType Default
        Require user @SYSTEM
        Order deny,allow
        Allow @LOCAL
    </Limit>
    <Limit All>
        Order deny,allow
        Allow @LOCAL
    </Limit>
</Policy>

<Policy authenticated>
    <Limit All>
        AuthType Default
        Order deny,allow
        Allow @LOCAL
    </Limit>
</Policy>
