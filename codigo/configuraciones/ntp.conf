# ============================================================================
# ntp.conf - Servidor de tiempo del Instituto ITEC (ntpsec / Ubuntu 24.04)
# ----------------------------------------------------------------------------
# Proyecto Final - Administracion de Infraestructura de TI (Uniquindio 2026-1)
#
# El servidor sincroniza con el pool publico de NTP (zona Colombia y
# Sudamerica) y sirve la hora a toda la LAN 192.168.80.0/24 (clientes Linux
# de las salas y equipos Windows de administracion).
#
# Se despliega con: codigo/instalacion/03_configurar_ntp.sh
# destino en la VM : /etc/ntpsec/ntp.conf
#
# Referencia de opciones: man 5 ntp.conf (paquete ntpsec)
# ============================================================================

# Fichero de deriva: guarda la desviacion del reloj del hardware para
# converger mas rapido tras reinicios.
driftfile /var/lib/ntpsec/ntp.drift

# ----------------------------------------------------------------------------
# Fuentes de tiempo (upstream). Se usan 5 servidores de zonas cercanas para
# tolerar caidas de alguno de ellos. 'iburst' acelera el primer arranque.
# ----------------------------------------------------------------------------
server 0.co.pool.ntp.org iburst
server 1.co.pool.ntp.org iburst
server 2.co.pool.ntp.org iburst
server 3.south-america.pool.ntp.org iburst
server 0.pool.ntp.org iburst

# ----------------------------------------------------------------------------
# Control de acceso (restrict).
#
#  - default: internet en general puede consultar la HORA (funcion de
#    servidor) pero no modificar ni consultar estado (nomodify notrap nopeer
#    noquery). 'kod' responde kiss-of-death a clientes abusivos.
#  - localhost: control total para administracion local (ntpq local).
#  - LAN: los equipos de 192.168.80.0/24 pueden sincronizar y consultar
#    estado; no modificar nada del servidor.
# ----------------------------------------------------------------------------
restrict default kod nomodify notrap nopeer noquery

restrict 127.0.0.1
restrict ::1

restrict 192.168.80.0 mask 255.255.255.0 nomodify notrap nopeer

# ----------------------------------------------------------------------------
# Notas de operacion:
#  - El puerto 123/udp se filtra con UFW solo para la LAN (ufw_reglas.sh).
#  - Verificar fuentes con:       ntpq -p
#  - Verificar estado del demonio: systemctl status ntpsec
#  - Clientes Linux: apuntar chrony o ntpsec a 192.168.80.10 (ver 03_configurar_ntp.sh).
#  - Clientes Windows: w32tm /config /manualpeerlist:192.168.80.10 ...
# ----------------------------------------------------------------------------
