# ============================================================================
# smb.conf - Comparticion de archivos para Windows (Samba, modo standalone)
# ----------------------------------------------------------------------------
# Proyecto Final - Administracion de Infraestructura de TI (Uniquindio 2026-1)
# Instituto Tecnico de Educacion Comfenalco Quindio
#
# Se despliega con: codigo/instalacion/07_instalar_samba.sh
# destino en la VM : /etc/samba/smb.conf
#
# Decisiones del diseño (analisis.md, secciones 3.7 y 7):
#   - Servidor independiente (security = user, cuentas propias Samba).
#   - Solo SMB directo en 445/tcp; NetBIOS deshabilitado (nmbd apagado y
#     'disable netbios = yes', 'smb ports = 445').
#   - Un recurso por carpeta de /srv/compartido con permisos por grupo POSIX
#     (academicos, secretaria, contabilidad, publico) creados por
#     04_instalar_nfs.sh; Samba hereda esos permisos (no guest access:
#     cumplimiento Ley 1581 de 2012 sobre datos de matriculas).
#
# Referencia: man smb.conf (Samba 4.x)
# ============================================================================

[global]
    # Servidor independiente de dominio.
    server role = standalone server
    security = user

    # Identificacion basica de la red Windows del instituto.
    workgroup = ITEC
    server string = Servidor de archivos Instituto ITEC

    # Solo SMB directo en 445, sin NetBIOS (decision del diseño).
    smb ports = 445
    disable netbios = yes

    # Registro de eventos: un archivo por cliente, 1 MB maximo.
    log file = /var/log/samba/log.%m
    max log size = 1000
    log level = 1

    # Cuentas y contrasenas.
    passdb backend = tdbsam
    obey pam restrictions = yes
    unix password sync = yes
    pam password change = yes

    # Soporte de nombres y caracteres en espanol.
    unix charset = UTF-8

    # Desempeno: soporte de busqueda moderna por SMB2/SMB3.
    server min protocol = SMB2
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

# ----------------------------------------------------------------------------
# Recursos compartidos sobre el arbol /srv/compartido.
# 'valid users' limita por grupo POSIX; 'force group' hace que los archivos
# nuevos queden con el grupo de la carpeta para que los permisos se respeten
# tanto por NFS como por Samba sobre el mismo arbol.
# ----------------------------------------------------------------------------

[academicos]
    comment = Trabajos y guias academicas (docentes y secretaria)
    path = /srv/compartido/academicos
    browseable = yes
    read only = no
    valid users = @academicos @secretaria
    force group = +academicos
    create mask = 0660
    directory mask = 0770
    veto files = /.DS_Store/Thumbs.db/

[secretaria]
    comment = Matriculas y certificados (secretaria academica)
    path = /srv/compartido/secretaria
    browseable = yes
    read only = no
    valid users = @secretaria
    force group = +secretaria
    create mask = 0660
    directory mask = 0770
    veto files = /.DS_Store/Thumbs.db/

[contabilidad]
    comment = Facturacion y cartera (contabilidad)
    path = /srv/compartido/contabilidad
    browseable = yes
    read only = no
    valid users = @contabilidad
    force group = +contabilidad
    create mask = 0660
    directory mask = 0770
    veto files = /.DS_Store/Thumbs.db/

[publico]
    comment = Material didactico de libre consulta (usuarios con cuenta)
    path = /srv/compartido/publico
    browseable = yes
    read only = no
    valid users = @academicos @secretaria @contabilidad @publico
    force group = +publico
    create mask = 0664
    directory mask = 0775
    veto files = /.DS_Store/Thumbs.db/

# ----------------------------------------------------------------------------
# Papelera de reciclaje por recurso (mitigacion de borrados accidentales):
# si se desea activar, agregue en cada recurso:
#   vfs objects = recycle
#   recycle:repository = .papelera/%U
#   recycle:keeptree = yes
#   recycle:versions = yes
# ----------------------------------------------------------------------------
